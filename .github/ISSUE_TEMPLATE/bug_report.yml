name: Signaler un problème
description: Installation, compatibilité Moodle ou comportement inattendu.
body:
  - type: markdown
    attributes:
      value: "Ne joignez aucun cookie, clé, document de cours ou fichier session.json."
  - type: textarea
    id: problem
    attributes:
      label: Problème et étapes pour le reproduire
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Système et version Python
      placeholder: Ubuntu 24.04, Python 3.12
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic expurgé et résultat attendu
