name: Report a problem
description: Installation, Moodle compatibility or unexpected behavior.
body:
  - type: markdown
    attributes:
      value: "Never attach cookies, keys, course documents or session.json."
  - type: textarea
    id: problem
    attributes:
      label: Problem and steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: Ubuntu 24.04, Python 3.12
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Redacted diagnostic output and expected behavior
